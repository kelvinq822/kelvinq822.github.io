<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>距離Matthew離開</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1b2a4a 0%, #0b1120 60%, #05070d 100%);
    font-family: "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: #e8eefc;
    overflow: hidden;
    padding: 20px;
  }

  /* 背景微光動畫 */
  body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background: radial-gradient(circle, rgba(90,150,255,0.12) 0%, transparent 55%);
    animation: drift 14s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes drift {
    from { transform: translate(-8%, -6%) scale(1); }
    to   { transform: translate(8%, 6%) scale(1.15); }
  }

  .title {
    font-size: clamp(1.6rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-align: center;
    margin-bottom: 0.6rem;
    background: linear-gradient(90deg, #9ec5ff, #ffffff, #9ec5ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 32px rgba(120,170,255,0.35);
    position: relative;
    z-index: 1;
  }

  .subtitle {
    font-size: clamp(0.75rem, 2.2vw, 1rem);
    letter-spacing: 0.35em;
    color: #7f95c4;
    margin-bottom: 3rem;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .countdown {
    display: flex;
    gap: clamp(10px, 2.5vw, 28px);
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: clamp(70px, 18vw, 130px);
    padding: clamp(14px, 3vw, 26px) clamp(8px, 2vw, 20px);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(150, 185, 255, 0.18);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    transition: transform 0.25s ease;
  }

  .unit:hover {
    transform: translateY(-6px);
  }

  .number {
    font-size: clamp(1.9rem, 7vw, 4rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    color: #ffffff;
    text-shadow: 0 0 18px rgba(130, 180, 255, 0.55);
  }

  .label {
    margin-top: 0.5rem;
    font-size: clamp(0.65rem, 1.8vw, 0.85rem);
    letter-spacing: 0.22em;
    color: #8ba3d4;
  }

  /* 秒數跳動效果 */
  .pulse {
    animation: pulse 1s ease-out;
  }

  @keyframes pulse {
    0%   { transform: scale(1);    }
    35%  { transform: scale(1.09); }
    100% { transform: scale(1);    }
  }

  .finished {
    font-size: clamp(1.2rem, 4vw, 2rem);
    letter-spacing: 0.2em;
    text-align: center;
    color: #ffd9a0;
    text-shadow: 0 0 24px rgba(255, 190, 100, 0.5);
    position: relative;
    z-index: 1;
  }

  .footer {
    position: fixed;
    bottom: 18px;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: #4d5f83;
    z-index: 1;
  }
</style>
</head>
<body>

  <h1 class="title">距離Matthew離開</h1>
  <div class="subtitle">2027 . 07 . 15</div>

  <div class="countdown" id="countdown">
    <div class="unit">
      <span class="number" id="days">--</span>
      <span class="label">天 DAYS</span>
    </div>
    <div class="unit">
      <span class="number" id="hours">--</span>
      <span class="label">時 HOURS</span>
    </div>
    <div class="unit">
      <span class="number" id="minutes">--</span>
      <span class="label">分 MINUTES</span>
    </div>
    <div class="unit">
      <span class="number" id="seconds">--</span>
      <span class="label">秒 SECONDS</span>
    </div>
  </div>

  <div class="footer">倒數中 · COUNTING DOWN</div>

<script>
  // 目標時間：2027 年 7 月 15 日 00:00:00（本地時間）
  const targetDate = new Date(2027, 6, 15, 0, 0, 0).getTime();

  const el = {
    days:    document.getElementById('days'),
    hours:   document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds')
  };

  const countdownBox = document.getElementById('countdown');
  const footer = document.querySelector('.footer');

  const pad = (n, len = 2) => String(n).padStart(len, '0');

  function update() {
    const now = Date.now();
    let diff = targetDate - now;

    // 時間到
    if (diff <= 0) {
      countdownBox.innerHTML = '<div class="finished">Matthew 已經離開了。</div>';
      footer.textContent = 'TIME IS UP';
      clearInterval(timer);
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);

    const days    = Math.floor(totalSeconds / 86400);
    const hours   = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    el.days.textContent    = days;
    el.hours.textContent   = pad(hours);
    el.minutes.textContent = pad(minutes);

    // 秒數變化時加入跳動動畫
    if (el.seconds.textContent !== pad(seconds)) {
      el.seconds.textContent = pad(seconds);
      el.seconds.classList.remove('pulse');
      void el.seconds.offsetWidth; // 重設動畫
      el.seconds.classList.add('pulse');
    }
  }

  update();
  const timer = setInterval(update, 200);
</script>

</body>
</html>
